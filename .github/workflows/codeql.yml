name: CodeQL
# 静的解析(JavaScript/TypeScript と Swift)。警告のみ: 必須チェックにはしない。
# 非公開リポジトリでは結果をActionsの成果物として保存する（Securityタブには表示されない）。
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '41 21 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before CodeQL starts tracing. Once it does, the build steps run under Rosetta, and Homebrew refuses
      # to install there ("Cannot install under Rosetta 2 in ARM default prefix"). Generating the project
      # needs no tracing: only the compile below is what CodeQL must watch.
      - name: Generate the Xcode project (Swift only)
        if: matrix.language == 'swift'
        shell: bash
        run: |
          brew install xcodegen
          scripts/check-xcodegen-version
          xcodegen generate
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build the app (Swift only)
        if: matrix.language == 'swift'
        shell: bash
        run: |
          # One architecture only: 'generic/platform' builds arm64 and x86_64, and under CodeQL's tracing the
          # first attempt (both) did not finish in 45 minutes.
          xcodebuild build -project studiquo.xcodeproj -scheme studiquo -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
      - name: Summarize CodeQL results
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/codeql-results/${{ matrix.language == 'javascript-typescript' && 'javascript' || matrix.language }}.sarif"
          test -s "$result"
          count=$(jq -er '[.runs[].results[]?] | length' "$result")
          {
            echo "### CodeQL (${{ matrix.language }})"
            echo "検出件数: $count。詳細はこの実行の成果物を確認してください。"
            echo "Securityタブへの登録と過去の結果との差分判定は行われません。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save CodeQL results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-results
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
