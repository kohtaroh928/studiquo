name: Security SAST
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * 0'
permissions:
  contents: read
concurrency:
  group: security-sast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Install pinned local scanners
        shell: bash
        run: |
          python -m pip install semgrep==1.179.0
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_darwin_x64.tar.gz
          echo "41c44ae8ad1d6eef57d4526ad0fd67d8129eee9a856f55c2b3b9395fd3d9ec0f  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/security-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-bin" gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Test scanner rules and report safety
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          python -m unittest discover -s security/sast -p 'test_*.py'
          python security/sast/test_rules.py
      - name: Scan code, Git history and dependencies (report-only findings)
        run: python security/sast/run.py
      - name: Store sanitized reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-sast-summary
          path: security-reports/sast/summary.*
          if-no-files-found: error
          retention-days: 14
