name: Security DAST
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-dast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --prefix mcp-server
      - name: Type-check the DAST scripts
        run: mcp-server/node_modules/.bin/tsc -p security/tsconfig.json
      - name: Verify DAST boundaries and HTTP contracts
        run: |
          node --test security/dast/harness.test.ts
          PYTHONDONTWRITEBYTECODE=1 python3 security/dast/scan_proof_test.py
      - name: Pull pinned official scanner before network isolation
        run: docker pull zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
      - name: Scan isolated local Worker
        run: node security/dast/run.ts --output security-reports/dast.json
      - name: Retain sanitized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-dast-summary
          path: security-reports/dast.json
          if-no-files-found: error
          retention-days: 14
