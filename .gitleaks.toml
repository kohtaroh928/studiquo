# gitleaks の設定。標準ルールに、誤検知と確認済みのものだけを除外する。
# 新しい除外を足すときは、なぜ秘密ではないかをここにコメントで残す。
title = "Studiquo secret detection"
[extend]
useDefault = true

[allowlist]
description = "秘密ではないと確認済みのもの"
regexes = [
  # 友達コードに使う文字の一覧(紛らわしい 0/O/1/I を除いた定数)。鍵ではない。
  '''^ABCDEFGHJKLMNPQRSTUVWXYZ23456789$''',
  # RAGのライブ検証テストが使う、値が「synthe…」で始まる架空のキー。実在の鍵ではない。
  '''^synthe''',
]
# RAG品質評価の生成結果(ファイルのハッシュや判定ケースのハッシュを含む)。鍵ではない。
paths = [
  '''^docs/RAG_[A-Z_]+_RESULTS\.json$''',
]

# 評価用などのCloudflare APIトークン。トークンは接頭辞のない英数字40字前後で、標準ルールでは
# 「cloudflare」という語の近くにあるときしか拾えない。環境変数名への代入を直接拾う。
# (docs/RUNBOOK.md 付録A-5)
[[rules]]
id = "studiquo-cloudflare-api-token-assignment"
description = "CLOUDFLARE_API_TOKEN に実際の値が代入されている"
regex = '''(?i)CLOUDFLARE_API_TOKEN["']?\s*[:=]\s*["']?[A-Za-z0-9_-]{30,}'''
keywords = ["cloudflare_api_token"]
