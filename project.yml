name: studiquo
configs:
  Debug: debug
  Release: release
  # The staging scheme uses the same source and feature set as Debug, but a
  # separate app identity and service configuration.
  Staging: debug
options:
  bundleIdPrefix: com.yabuko
  # xcuserdata内のユーザースキームは共有スキームより優先される。LaunchActionが空のものが
  # 残るとXcodeのRunが実機に転送・起動しなくなる(2026-10)ので、再生成のたびに消す。
  postGenCommand: rm -f studiquo.xcodeproj/xcuserdata/*/xcschemes/studiquo.xcscheme
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    # Pinned to a commit on main: the latest release (1.7.2) has neither line
    # wrapping nor $...$ delimiters, and the 1.7.3 tag cannot be fetched.
    revision: 1d2c90827e9c3908269d810d055fb03b7da5fd53
schemes:
  studiquo:
    build:
      targets:
        studiquo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - studiquoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # ステージング接続用。Runするとアプリの接続先(mcpCloudEndpoint)が、起動引数でステージングのWorkerになる。
  # 起動引数は、その実行の間だけ有効で、端末に保存されない。Debugビルドだけが、本番以外のホストに接続できる
  # (WorkerEndpointPolicy)。ステージングのURLが変わったら、ここを書き換える。
  studiquo-staging:
    build:
      targets:
        studiquo: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - studiquoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # UIテスト専用。studiquo スキームのテストは単体テストだけにして日常の実行を軽くし、
  # UIテストは `xcodebuild test -scheme studiquoUITests -only-testing:studiquoUITests/<クラス>` で動かす。
  studiquoUITests:
    build:
      targets:
        studiquo: all
        studiquoUITests: [test]
    test:
      config: Debug
      targets:
        - studiquoUITests
targets:
  studiquo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: studiquo
    # A build without the RevenueCat key stops at launch (a blank white screen
    # under the debugger), so refuse to build it instead.
    preBuildScripts:
      - name: Check RevenueCat key
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$STUDIQUO_REVENUECAT_PUBLIC_API_KEY" ]; then
            echo "error: STUDIQUO_REVENUECAT_PUBLIC_API_KEY is empty for $CONFIGURATION. For Staging, put it in Configuration/Staging.local.xcconfig (ignored by git; a worktree under .worktrees/ reads the main checkout's copy)."
            exit 1
          fi
    entitlements:
      path: studiquo/studiquo.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:$(STUDIQUO_ASSOCIATED_DOMAIN)
          - webcredentials:$(STUDIQUO_ASSOCIATED_DOMAIN)
        com.apple.developer.icloud-container-identifiers:
          - $(STUDIQUO_CLOUDKIT_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        # Shared with the studiquoShare extension: the inbox where shared
        # files wait for the student to choose a destination folder.
        com.apple.security.application-groups:
          - $(STUDIQUO_APP_GROUP)
    # Sign in with Apple's SystemCapabilities entry can't be expressed here:
    # xcodegen 2.46.0 mis-serializes a 2-level-nested `attributes` dict into a
    # single string, corrupting project.pbxproj. It must be re-added by hand
    # in project.pbxproj (PBXProject.attributes.TargetAttributes.<target>)
    # after every `xcodegen generate`, alongside studiquo.entitlements.
    # NOTE: The CloudKit capability (iCloud com.apple.developer.icloud-services /
    # icloud-container-identifiers above) may hit the same xcodegen nested-dict
    # serialization bug as Sign in with Apple. After `xcodegen generate`, verify
    # project.pbxproj actually contains the CloudKit entry under
    # PBXProject.attributes.TargetAttributes.<target>.SystemCapabilities, and
    # add it by hand there if it's missing or corrupted.
    dependencies:
      - target: studiquoShare
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: RevenueCat
        product: RevenueCat
      - package: SwiftMath
        product: SwiftMath
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        # iPad-only: the app is not offered on Apple silicon Macs ("Designed
        # for iPad"). Also untick the Mac availability in App Store Connect.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquo
        PRODUCT_NAME: studiquo
        STUDIQUO_APP_PRODUCT_NAME: studiquo
        STUDIQUO_ENVIRONMENT: production
        STUDIQUO_WORKER_ENDPOINT: https://api.studiquo.app
        STUDIQUO_ASSOCIATED_DOMAIN: api.studiquo.app
        STUDIQUO_CLOUDKIT_CONTAINER: iCloud.com.yabuko.studiquo
        STUDIQUO_APP_GROUP: group.com.yabuko.studiquo.share
        # Neither key existed anywhere in the project before (not here, not
        # in the generated Info.plist) — an archive built without them has
        # no CFBundleShortVersionString/CFBundleVersion at all, which
        # App Store Connect rejects outright. 1.0/1 is a starting point,
        # not a guess at what's already live — bump CURRENT_PROJECT_VERSION
        # before any upload that isn't the very first one.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 972G4VGUA6
        GENERATE_INFOPLIST_FILE: YES
        # The ~ipad-suffixed key alone never actually landed in the built
        # Info.plist (confirmed by inspecting a real archive) even though
        # TARGETED_DEVICE_FAMILY is iPad-only — App Store Connect validation
        # failed with "No orientations were specified" as a result. Setting
        # the plain, unsuffixed key too is what actually reaches the plist.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "ロックしたノートを安全に開くためにFace IDを使用します。"
        INFOPLIST_KEY_NSCameraUsageDescription: "授業資料や書類をスキャンしてノートに取り込むためにカメラを使用します。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ノートを見ながら資料写真を表示するために写真ライブラリを使用します。"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug: &productionServiceSettings
          STUDIQUO_REVENUECAT_PUBLIC_API_KEY: appl_vVZTDpluttzBVtyfnYdYaklHPGc
          STUDIQUO_GOOGLE_IOS_CLIENT_ID: 812858933445-5edfqlngkoakh9n22p16qhb2f9u9t6hd.apps.googleusercontent.com
          STUDIQUO_GOOGLE_SERVER_CLIENT_ID: 812858933445-q6j9uih0o702884hemnk2okiet26gv1j.apps.googleusercontent.com
          STUDIQUO_GOOGLE_URL_SCHEME: com.googleusercontent.apps.812858933445-5edfqlngkoakh9n22p16qhb2f9u9t6hd
        Release: *productionServiceSettings
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquo.staging
          PRODUCT_NAME: "studiquo Staging"
          PRODUCT_MODULE_NAME: studiquo
          STUDIQUO_APP_PRODUCT_NAME: "studiquo Staging"
          STUDIQUO_ENVIRONMENT: staging
          # This custom domain is provisioned with the staging Worker. It is
          # also the WebAuthn relying-party and universal-link host, so the app
          # never falls back to workers.dev.
          STUDIQUO_WORKER_ENDPOINT: https://staging-api.studiquo.app
          STUDIQUO_ASSOCIATED_DOMAIN: staging-api.studiquo.app
          STUDIQUO_CLOUDKIT_CONTAINER: iCloud.com.yabuko.studiquo.staging
          STUDIQUO_APP_GROUP: group.com.yabuko.studiquo.staging.share
          # Staging credentials come from Configuration/Staging.xcconfig,
          # whose machine-local override is deliberately not committed.
    info:
      path: studiquo/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSFaceIDUsageDescription: "ロックしたノートを安全に開くためにFace IDを使用します。"
        NSCameraUsageDescription: "授業資料やQRコードを読み取るためにカメラを使用します。"
        NSPhotoLibraryUsageDescription: "ノートを見ながら資料写真を表示するために写真ライブラリを使用します。"
        UIBackgroundModes:
          - remote-notification
        # Exported type for page snippets (drag/copy between notes). Kept here
        # because xcodegen regenerates studiquo/Info.plist from this block and
        # drops any key that only exists in the plist file.
        # Lets studiquo appear as an "Open in…" target for course material in
        # the Files app. Rank Alternate: we never claim to be the default
        # viewer for PDFs. The files are copied in, not opened in place — they
        # go through the same destination picker as a share-extension batch.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Course material
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.presentationml.presentation
              - public.image
              - public.plain-text
              - public.comma-separated-values-text
              - public.tab-separated-values-text
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.studiquo.page-snippet
            UTTypeDescription: Studiquo Page Snippet
            UTTypeConformsTo:
              - public.data
        GIDClientID: $(STUDIQUO_GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(STUDIQUO_GOOGLE_SERVER_CLIENT_ID)
        StudiquoEnvironment: $(STUDIQUO_ENVIRONMENT)
        StudiquoWorkerEndpoint: $(STUDIQUO_WORKER_ENDPOINT)
        StudiquoCloudKitContainer: $(STUDIQUO_CLOUDKIT_CONTAINER)
        StudiquoAppGroup: $(STUDIQUO_APP_GROUP)
        StudiquoRevenueCatPublicAPIKey: $(STUDIQUO_REVENUECAT_PUBLIC_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.yabuko.studiquo.friend
            CFBundleURLSchemes:
              - studiquo
          - CFBundleURLName: com.yabuko.studiquo.google-signin
            CFBundleURLSchemes:
              - $(STUDIQUO_GOOGLE_URL_SCHEME)
    configFiles:
      Staging: Configuration/Staging.xcconfig
  # Share extension: puts studiquo in the share sheet's app row (Files app,
  # Photos…). Compiles only SharedInbox from the app's sources — it copies
  # files into the App Group inbox and opens the app; nothing heavier fits in
  # an extension's memory budget.
  studiquoShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: studiquoShare
      - path: studiquo/Services/SharedInbox.swift
    entitlements:
      path: studiquoShare/studiquoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(STUDIQUO_APP_GROUP)
    info:
      path: studiquoShare/Info.plist
      properties:
        CFBundleDisplayName: studiquo
        StudiquoAppGroup: $(STUDIQUO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem,
              SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.wordprocessingml.document"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.presentationml.presentation"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.comma-separated-values-text"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.tab-separated-values-text"
              ).@count >= 1).@count >= 1
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquo.share
        PRODUCT_NAME: studiquoShare
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 972G4VGUA6
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquo.staging.share
          STUDIQUO_APP_GROUP: group.com.yabuko.studiquo.staging.share
  studiquoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: studiquoTests
    dependencies:
      - target: studiquo
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquoTests
        GENERATE_INFOPLIST_FILE: YES
        STUDIQUO_APP_PRODUCT_NAME: studiquo
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(STUDIQUO_APP_PRODUCT_NAME).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/$(STUDIQUO_APP_PRODUCT_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Staging:
          STUDIQUO_APP_PRODUCT_NAME: "studiquo Staging"
  studiquoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: studiquoUITests
    dependencies:
      - target: studiquo
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: studiquo
      configs:
        Staging:
          TEST_TARGET_NAME: studiquo
