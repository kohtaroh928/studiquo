name: studiquo
options:
  bundleIdPrefix: com.yabuko
  deploymentTarget:
    iOS: "17.0"
targets:
  studiquo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: studiquo
    info:
      path: studiquo/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.yabuko.studiquo
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 972G4VGUA6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "ロックしたノートを安全に開くためにFace IDを使用します。"
        INFOPLIST_KEY_NSCameraUsageDescription: "授業資料や書類をスキャンしてノートに取り込むためにカメラを使用します。"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
